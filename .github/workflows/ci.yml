name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node tools/straznik.mjs --tree HEAD
      # Drogi: żaden dokument nie może leżeć bez ścieżki od drzwi, żaden odnośnik prowadzić donikąd.
      # Druga linia pilnuje, żeby zapisany raport zgadzał się z tym, co naprawdę jest w repo.
      - run: node tools/drogi.mjs --raport DROGI.md
      - run: git diff --exit-code DROGI.md
